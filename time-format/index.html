<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>时间戳转换</title>
    <meta name="keywords" content="时间戳转换">
    <meta name="description" content="unix时间戳转换">
    <link rel="shortcut icon" href="../index/favicon.ico">
    <link rel="stylesheet" href="style.css" type="text/css">
</head>
<body>
    <div class="page">
        <header class="header">
            <div class="brand">
                <div class="logo" aria-hidden="true">时</div>
                <div>
                    <h1>时间戳转换</h1>
                    <p>Unix 时间戳与北京时间互相转换，支持多行批量处理</p>
                </div>
            </div>
            <nav class="nav">
                <a href="https://scott180.github.io/tool" target="_blank" rel="noopener">工具网站</a>
                <a href="https://github.com/bigfoot110614/timeChange/blob/master/time.html" target="_blank" rel="noopener">参考项目</a>
            </nav>
        </header>

        <main class="card">
            <div class="unit">
                <span>时间单位</span>
                <select id="list">
                    <option value="mili">毫秒</option>
                    <option value="second">秒</option>
                </select>
            </div>
            <label class="field">
                <span class="field-label">时间戳</span>
                <textarea id="in" rows="6">1648905743000</textarea>
            </label>
            <div class="actions">
                <button class="btn primary" id="btn" type="button">时间戳 → 北京时间</button>
                <button class="btn" id="BJtoUnix" type="button">北京时间 → 时间戳</button>
            </div>
            <label class="field">
                <span class="field-label">北京时间</span>
                <textarea id="out" rows="6">2022-04-02 21:22:23</textarea>
            </label>
            <p class="hint">每行一条。向下转换读取上方时间戳，向上转换读取下方北京时间，格式为 YYYY-MM-DD HH:mm:ss。</p>
        </main>
    </div>
<script>
    var list=document.getElementById('list');
    var Out=document.getElementById('out');
    btn.onclick=function(e){
        Out.value=null;
        var In=document.getElementById('in');
        var InValue=In.value;
        if(InValue){
            console.log(InValue);
            InValue=InValue.replace(/\/r\/n|(\s)+/g,',').split(',');
            console.log(InValue);
            var outInner=[];
            InValue.forEach(function (item,index) {
                if(Number(item)){
                    if(list.value=='mili'){
                        var unixTimestamp = new Date(parseInt(item));
                    }else {
                        var unixTimestamp = new Date(parseInt(item)*1000);
                    }
                    commonTime=formatDate(unixTimestamp);
                    outInner.push(commonTime);
                }
            });
            Out.value=outInner.join('\r');
        }
    }
    BJtoUnix.onclick= function (e) {
        var In=document.getElementById('in');
        if(Out.value){
            var OutValue=Out.value.replace(/\n/g,',').split(',');
            var Inner=[];
            OutValue.forEach(function (item,index) {
                var tem=item.split(/(-|:|\s)/g);
				console.log(tem);
				tem = [tem[0],tem[2],tem[4],tem[6],tem[8],tem[10]];
                var timestamp2 = Date.UTC(Number(tem[0]),Number(tem[1])-1,Number(tem[2]),Number(tem[3])-8,Number(tem[4]),Number(tem[5]));
                console.log(timestamp2);
                if(list.value=='second'){
                    timestamp2 = timestamp2 / 1000;
                }
                Inner.push(timestamp2);
                console.log(Inner);
            });
            In.value=Inner.join('\r');
        }
    }
    function formatDate(now) {
        var year=now.getFullYear();
        var month=now.getMonth()+1;
		month = month<10 ? "0"+month : month;
        var date=now.getDate();
		date = date<10 ? "0"+date : date;
        var hour=now.getHours();
		hour=(hour>9?hour:'0'+hour);
        var minute=now.getMinutes();
        minute=(minute>9?minute:'0'+minute);
        var second=now.getSeconds();
        second=(second>9?second:'0'+second);
        return year+"-"+month+"-"+date+" "+hour+":"+minute+":"+second;
    }

</script>
</body>
</html>
