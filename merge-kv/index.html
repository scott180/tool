<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key-Value 合并工具</title>
    <style>
        :root {
            --bg0: #dce6f2;
            --bg1: #eef3f8;
            --card: #ffffff;
            --ink: #1b2430;
            --muted: #6b7788;
            --line: #e4eaf1;
            --input-bg: #f7f9fc;
            --primary: #3b5bdb;
            --primary-hover: #4c6ef5;
            --success: #0b9b75;
            --success-hover: #12b886;
            --danger: #c92a2a;
            --danger-hover: #e03131;
            --shadow: 0 18px 50px rgba(28, 48, 74, 0.12);
            --radius: 18px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            color: var(--ink);
            min-height: 100vh;
            background:
                radial-gradient(900px 420px at 12% -10%, rgba(91, 130, 214, 0.28), transparent 60%),
                radial-gradient(700px 360px at 100% 0%, rgba(18, 184, 134, 0.14), transparent 55%),
                linear-gradient(180deg, var(--bg1) 0%, var(--bg0) 100%);
            padding: 48px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .container {
            background: var(--card);
            padding: 32px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 720px;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--line);
        }
        .logo {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: linear-gradient(160deg, #4c6ef5, #3b5bdb);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.4px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 8px 16px rgba(59, 91, 219, 0.28);
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.2px;
            line-height: 1.3;
        }
        .hint {
            color: var(--muted);
            font-size: 13px;
            margin-top: 4px;
            line-height: 1.5;
        }
        .field {
            margin-bottom: 18px;
        }
        .field-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        label, .output-label {
            font-weight: 600;
            color: #334155;
            font-size: 14px;
        }
        .count {
            font-size: 12px;
            color: var(--muted);
            background: var(--input-bg);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 2px 8px;
        }
        textarea,
        .output {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--line);
            border-radius: 12px;
            font-family: "Cascadia Code", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 13.5px;
            line-height: 1.75;
            background: var(--input-bg);
            color: var(--ink);
        }
        textarea {
            height: 210px;
            resize: vertical;
            min-height: 140px;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }
        textarea::placeholder {
            color: #93a1b3;
        }
        textarea:hover {
            border-color: #cdd7e4;
        }
        textarea:focus {
            border-color: var(--primary);
            outline: none;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(59, 91, 219, 0.14);
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin: 6px 0 22px;
        }
        button {
            flex: 1;
            padding: 11px 16px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s, transform 0.12s, box-shadow 0.2s, filter 0.2s;
            font-weight: 600;
            letter-spacing: 1px;
        }
        button:hover {
            transform: translateY(-1px);
        }
        button:active {
            transform: scale(0.985);
        }
        .btn-process {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 8px 16px rgba(59, 91, 219, 0.22);
        }
        .btn-process:hover {
            background: var(--primary-hover);
        }
        .btn-copy {
            background: var(--success);
            color: #fff;
            box-shadow: 0 8px 16px rgba(11, 155, 117, 0.18);
        }
        .btn-copy:hover {
            background: var(--success-hover);
        }
        .btn-clear {
            background: #fff;
            color: var(--danger);
            border: 1px solid #f1c0c0;
            box-shadow: none;
        }
        .btn-clear:hover {
            background: #fff5f5;
            border-color: #e99;
        }
        .output {
            min-height: 92px;
            border-left: 3px solid #c5d0de;
        }
        .output-placeholder,
        .output-error {
            color: #8a97a8;
        }
        .output-error {
            color: #c92a2a;
            background: #fff5f5;
            border-color: #f3c6c6;
            border-left-color: #e03131;
        }
        .output-result {
            background: #fff;
            border-left-color: var(--primary);
        }
        .kv-line + .kv-line {
            margin-top: 2px;
        }
        .kv-key {
            color: #3b5bdb;
            font-weight: 600;
        }
        .kv-colon {
            color: #94a3b8;
            margin: 0 2px;
        }
        .kv-value {
            color: #1e293b;
        }
        .kv-value.is-empty::after {
            content: "空";
            color: #94a3b8;
            font-size: 12px;
            font-family: inherit;
            background: #eef2f7;
            border-radius: 4px;
            padding: 0 6px;
            margin-left: 2px;
        }
        .toast-mask {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.28);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(3px);
        }
        .toast-mask.show {
            display: flex;
        }
        .toast {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.2);
            padding: 26px 32px 20px;
            min-width: 260px;
            text-align: center;
            animation: toast-in 0.22s ease-out;
        }
        .toast-icon {
            width: 42px;
            height: 42px;
            margin: 0 auto 12px;
            border-radius: 50%;
            background: #e6fcf5;
            color: var(--success);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 700;
        }
        .toast-title {
            color: var(--ink);
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .toast-countdown {
            color: var(--muted);
            font-size: 13px;
        }
        .toast-bar {
            height: 4px;
            background: #e9eef5;
            border-radius: 999px;
            overflow: hidden;
            margin-top: 14px;
        }
        .toast-bar span {
            display: block;
            height: 100%;
            width: 100%;
            background: var(--success);
            transform-origin: left center;
        }
        .toast-mask.show .toast-bar span {
            animation: toast-bar 2s linear forwards;
        }
        @keyframes toast-in {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }
        @keyframes toast-bar {
            from { transform: scaleX(1); }
            to { transform: scaleX(0); }
        }
        @media (max-width: 560px) {
            body {
                padding: 16px 12px 28px;
            }
            .container {
                padding: 20px 16px;
                border-radius: 14px;
            }
            h1 {
                font-size: 18px;
            }
            .btn-group {
                flex-direction: column;
            }
            button {
                letter-spacing: 2px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header class="header">
        <div class="logo" aria-hidden="true">KV</div>
        <div>
            <h1>Key-Value 合并工具</h1>
            <p class="hint">每两行为一组；奇数行且相邻两行都是英文 key 时，前一行 value 为空</p>
        </div>
    </header>

    <div class="field">
        <div class="field-head">
            <label for="input">输入数据</label>
        </div>
        <textarea id="input" placeholder="例如：&#10;warehouse_id&#10;7&#10;warehouse_name&#10;杭州仓&#10;remark&#10;supplier_name&#10;上城供应发账单"></textarea>
    </div>

    <div class="btn-group">
        <button class="btn-process" id="btnMerge" type="button">合并</button>
        <button class="btn-copy" id="btnCopy" type="button">复制结果</button>
        <button class="btn-clear" id="btnClear" type="button">清空</button>
    </div>

    <div class="field">
        <div class="field-head">
            <span class="output-label">合并结果</span>
            <span class="count" id="resultCount">0 条</span>
        </div>
        <div id="output" class="output output-placeholder">结果将显示在这里...</div>
    </div>
</div>

<div class="toast-mask" id="toastMask">
    <div class="toast">
        <div class="toast-icon" aria-hidden="true">✓</div>
        <div class="toast-title">已复制到剪贴板</div>
        <div class="toast-countdown" id="toastCountdown">2 秒后自动关闭</div>
        <div class="toast-bar"><span></span></div>
    </div>
</div>

<script>
(function() {
    'use strict';

    var PLACEHOLDER = '结果将显示在这里...';
    var inputEl = document.getElementById('input');
    var outputEl = document.getElementById('output');
    var resultCountEl = document.getElementById('resultCount');
    var toastMask = document.getElementById('toastMask');
    var toastCountdown = document.getElementById('toastCountdown');
    var toastTimer = null;
    var toastRemain = 0;
    var lastPairs = null;

    function escapeHtml(text) {
        return String(text)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }

    function setPlaceholder() {
        lastPairs = null;
        outputEl.className = 'output output-placeholder';
        outputEl.textContent = PLACEHOLDER;
        resultCountEl.textContent = '0 条';
    }

    function setError(message) {
        lastPairs = null;
        outputEl.className = 'output output-error';
        outputEl.textContent = message;
        resultCountEl.textContent = '0 条';
    }

    function setResult(pairs) {
        lastPairs = pairs;
        outputEl.className = 'output output-result';
        outputEl.innerHTML = pairs.map(function(pair) {
            var emptyClass = pair.value === '' ? ' kv-value is-empty' : ' kv-value';
            return '<div class="kv-line"><span class="kv-key">' + escapeHtml(pair.key) +
                '</span><span class="kv-colon">:</span><span class="' + emptyClass.trim() + '">' +
                escapeHtml(pair.value) + '</span></div>';
        }).join('');
        resultCountEl.textContent = pairs.length + ' 条';
    }

    function hideCopyToast() {
        if (toastTimer) {
            clearInterval(toastTimer);
            toastTimer = null;
        }
        toastMask.classList.remove('show');
    }

    function showCopyToast() {
        hideCopyToast();
        toastRemain = 2;
        toastCountdown.textContent = toastRemain + ' 秒后自动关闭';
        toastMask.classList.add('show');
        toastTimer = setInterval(function() {
            toastRemain -= 1;
            if (toastRemain <= 0) {
                hideCopyToast();
                return;
            }
            toastCountdown.textContent = toastRemain + ' 秒后自动关闭';
        }, 1000);
    }

    function isEnglishKey(line) {
        return /^[A-Za-z][A-Za-z0-9_]*$/.test(line);
    }

    function process() {
        var raw = inputEl.value;
        if (!raw.trim()) {
            setError('请输入数据');
            return;
        }

        var lines = raw.split(/\r?\n/).map(function(line) { return line.trim(); });
        var validLines = lines.filter(function(line) { return line !== ''; });
        var result = [];
        var i = 0;

        while (i < validLines.length) {
            var key = validLines[i];
            var remaining = validLines.length - i;
            var next = i + 1 < validLines.length ? validLines[i + 1] : null;

            if (remaining % 2 === 1 && next !== null && isEnglishKey(key) && isEnglishKey(next)) {
                result.push({ key: key, value: '' });
                i += 1;
                continue;
            }

            result.push({ key: key, value: next !== null ? next : '' });
            i += next !== null ? 2 : 1;
        }

        setResult(result);
    }

    function copyResult() {
        if (!lastPairs || !lastPairs.length) {
            alert('没有可复制的内容！');
            return;
        }
        var text = lastPairs.map(function(pair) {
            return pair.key + ':' + pair.value;
        }).join('\n');

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function() {
                showCopyToast();
            }).catch(function(err) {
                console.error('复制失败:', err);
                fallbackCopy(text);
            });
        } else {
            fallbackCopy(text);
        }
    }

    function fallbackCopy(text) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        try {
            document.execCommand('copy');
            showCopyToast();
        } catch (err) {
            alert('复制失败，请手动选中复制。');
        }
        document.body.removeChild(ta);
    }

    function clearAll() {
        inputEl.value = '';
        setPlaceholder();
    }

    document.getElementById('btnMerge').addEventListener('click', process);
    document.getElementById('btnCopy').addEventListener('click', copyResult);
    document.getElementById('btnClear').addEventListener('click', clearAll);
})();
</script>

</body>
</html>
